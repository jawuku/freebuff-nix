name: Flake check

on:
  push:
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          # Authenticated requests avoid GitHub API rate limits when
          # fetching nixpkgs (pinned by flake.lock).
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run nix flake check
        run: nix flake check
