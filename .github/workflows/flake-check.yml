name: Flake check

on:
  push:
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          # Authenticated requests avoid GitHub API rate limits when
          # fetching nixpkgs (pinned by flake.lock).
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: freebuff-nix
          # Token with push access to the freebuff-nix cache. Without it the
          # action only pulls (read-only) — e.g. for fork PRs.
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # Also pull prebuilt packages from the nix-community public cache.
          extraPullNames: nix-community

      - name: Run nix flake check
        run: nix flake check

      # Build the FHS environment and upload it (with its closure) to the
      # freebuff-nix Cachix cache, so CI runs and other machines never rebuild
      # it. Requires the CACHIX_AUTH_TOKEN secret; without it cachix-action
      # above still pulls read-only.
      - name: Build and push the freebuff FHS environment
        # pipefail so a failing `nix build` fails the job even though its output
        # is piped to cachix push. Only x86_64-linux is built on this runner.
        run: |
          set -euo pipefail
          nix build . --no-link --print-out-paths \
            | cachix push freebuff-nix
