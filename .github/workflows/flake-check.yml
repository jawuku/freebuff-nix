name: Flake check

on:
  push:
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          # Authenticated requests avoid GitHub API rate limits when
          # fetching nixpkgs (pinned by flake.lock).
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: freebuff-nix
          # Token with push access to the freebuff-nix cache. Without it the
          # action only pulls (read-only) — e.g. for fork PRs.
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # Also pull prebuilt packages from the nix-community public cache.
          extraPullNames: nix-community

      - name: Run nix flake check
        run: nix flake check

      # Build the FHS environment and upload it (with its closure) to the
      # freebuff-nix Cachix cache, so CI runs and other machines never rebuild
      # it. Requires the CACHIX_AUTH_TOKEN secret; without it cachix-action
      # above still pulls read-only.
      - name: Build and push the freebuff FHS environment
        # pipefail so a failing `nix build` fails the job even though its output
        # is piped to cachix push. Only x86_64-linux is built on this runner.
        run: |
          set -euo pipefail
          nix build . --no-link --print-out-paths \
            | cachix push freebuff-nix

  # Build the aarch64-linux FHS environment (under QEMU emulation, since the
  # runner is x86_64) and push it to the cache so ARM machines never rebuild it.
  build-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Register qemu-aarch64 in binfmt_misc on the runner host, which lets the
      # Nix daemon build and run aarch64-linux derivations on this x86_64 runner.
      - name: Enable aarch64 emulation
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # Tell Nix it may realise aarch64-linux derivations on this machine.
          extra_nix_config: |
            extra-platforms = aarch64-linux

      - uses: cachix/cachix-action@v17
        with:
          name: freebuff-nix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          extraPullNames: nix-community

      - name: Build and push the aarch64-linux FHS environment
        # pipefail so a failing `nix build` fails the job even though its output
        # is piped to cachix push.
        run: |
          set -euo pipefail
          nix build .#packages.aarch64-linux.default --no-link --print-out-paths \
            | cachix push freebuff-nix
