name: Flake check

on:
  push:
  pull_request:

jobs:
  build-and-push:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # Both platforms report independently (an aarch64 failure doesn't
      # cancel the x86_64 result and vice versa).
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          # Native ARM64 hosted runner (free for public repos).
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          # Authenticated requests avoid GitHub API rate limits when
          # fetching nixpkgs (pinned by flake.lock).
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: freebuff-nix
          # Token with push access to the freebuff-nix cache. Without it the
          # action only pulls (read-only) — e.g. for fork PRs.
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # Also pull prebuilt packages from the nix-community public cache.
          extraPullNames: nix-community

      - name: Run nix flake check
        run: nix flake check

      # Build the FHS environment for this matrix system and upload it (with
      # its closure) to the freebuff-nix Cachix cache, so CI runs and other
      # machines never rebuild it.
      - name: Build and push the freebuff FHS environment
        # pipefail so a failing `nix build` fails the job even though its
        # output is piped to cachix push. On fork PRs the token secret is
        # absent, so skip the push instead of failing the job.
        run: |
          set -euo pipefail
          if cachix doctor 2>/dev/null | grep -q 'Auth token from config'; then
            nix build .#packages.${{ matrix.system }}.default --no-link --print-out-paths \
              | cachix push freebuff-nix
          else
            echo "No Cachix auth token (fork PR) — skipping push"
          fi

  # Flake inputs are downloaded from the internet and can disappear; upload
  # them (the repo source plus the pinned nixpkgs tarball) so this flake stays
  # reproducible forever. Runs once, independently of the per-platform builds.
  cache-inputs:
    name: Cache flake inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: freebuff-nix
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          extraPullNames: nix-community

      - name: Push flake inputs to the cache
        run: |
          set -euo pipefail
          if cachix doctor 2>/dev/null | grep -q 'Auth token from config'; then
            nix flake archive --json \
              | jq -r '.path, (.inputs | to_entries[].value.path)' \
              | cachix push freebuff-nix
          else
            echo "No Cachix auth token (fork PR) — skipping input push"
          fi
